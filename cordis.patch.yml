# Register the Cursor developer subagent plugin. It talks the Agent Client
# Protocol to the Cursor CLI directly: the host half serves the dashboard as
# plain HTML, and the browser half puts that page in a Sidebar tab.
- insert:
    - id: dsh-cursor-dev
      name: dsh-cursor-dev
    - id: tool-cursor-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: cursor
        toolName: cursor_subagent
        maxDepth: provider-managed
